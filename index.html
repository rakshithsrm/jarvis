<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Jarvis</title>
<style>
:root{color-scheme:dark;--bg:#05070d;--c:#38bdf8;--c2:#6366f1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;font-family:system-ui,sans-serif;color:#7c8aa5}
body{display:flex;align-items:center;justify-content:center;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#orb{width:min(62vw,280px);aspect-ratio:1;border-radius:50%;border:0;cursor:pointer;outline:0;
background:radial-gradient(circle at 35% 30%,#7dd3fc,var(--c2) 60%,#1e1b4b);
box-shadow:0 0 60px 10px #38bdf855;transition:transform .3s,filter .3s;opacity:.55;filter:grayscale(.6)}
#orb.listen{opacity:1;filter:none;animation:breathe 3s ease-in-out infinite}
#orb.think{opacity:1;filter:hue-rotate(60deg);animation:spin 1s linear infinite;border-radius:42% 58% 55% 45%}
#orb.speak{opacity:1;filter:none;animation:talk .45s ease-in-out infinite alternate;box-shadow:0 0 110px 30px #38bdf8aa}
@keyframes breathe{50%{transform:scale(1.06);box-shadow:0 0 90px 18px #38bdf877}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes talk{from{transform:scale(.97)}to{transform:scale(1.14)}}
#hint{margin-top:42px;font-size:13px;letter-spacing:.2em;text-transform:uppercase;opacity:.6}
</style>
</head>
<body>
<button id="orb" aria-label="Jarvis"></button>
<div id="hint">tap to wake</div>
<script>
const $=s=>document.querySelector(s), orb=$('#orb'), hint=$('#hint');
const S={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}if(['name','mem','notes','tasks','contacts'].includes(k)){try{localStorage.setItem('ts',Date.now())}catch{}clearTimeout(window._st);window._st=setTimeout(()=>push(),2500)}}};
let contacts=S.get('contacts',{}),pend=null,name=S.get('name',''),awaitName=false;
let notes=S.get('notes',[]),tasks=S.get('tasks',[]),mem=S.get('mem',[]),rems=S.get('rems',[]),hist=[];
let on=false,busy=false,speaking=false,awake=0,rec,voice,running=false;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

/* ---------- voice out ---------- */
function pickVoice(){const L=S.get('lang','en-IN'),v=speechSynthesis.getVoices();voice=v.find(x=>x.lang.replace('_','-')===L)||v.find(x=>x.lang.toLowerCase().startsWith(L.slice(0,2)))||v[0]}
speechSynthesis.onvoiceschanged=pickVoice;pickVoice();
function state(s){orb.className=s}
function speak(t){
  return new Promise(res=>{
    if(!t){res();return}
    speechSynthesis.cancel();
    try{rec&&rec.stop()}catch{}
    const u=new SpeechSynthesisUtterance(String(t).replace(/[*_#`>~|\[\]]/g,' ').replace(/https?:\/\/\S+/g,'link'));
    if(voice)u.voice=voice;u.lang=S.get('lang','en-IN');u.rate=1.03;
    speaking=true;state('speak');
    const done=()=>{speaking=false;state(on?'listen':'');res();listen()};
    u.onend=done;u.onerror=done;speechSynthesis.speak(u);
  });
}

/* ---------- voice in ---------- */
function listen(){
  if(!on||speaking||running||!SR)return;
  if(!rec){
    rec=new SR();rec.continuous=true;rec.interimResults=false;rec.lang=S.get('lang','en-IN');
    rec.onstart=()=>running=true;
    rec.onend=()=>{running=false;if(on&&!speaking&&!busy)setTimeout(listen,250)};
    rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){on=false;state('');hint.textContent='mic blocked'}};
    rec.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)heard(e.results[i][0].transcript)};
  }
  try{rec.start()}catch{}
}
async function heard(t){
  t=t.trim();const i=t.toLowerCase().search(/j[ae]rvis|service|जार्विस|जर्विस|ஜார்விஸ்|ಜಾರ್ವಿಸ್/);
  let cmd;
  if(i>=0)cmd=t.slice(i).replace(/^\S+[\s,.!?]*/,'');
  else if(Date.now()<awake)cmd=t;
  else return;
  if(!cmd){awake=Date.now()+8000;return speak('Yes?')}
  if(busy)return;
  busy=true;state('think');
  let r;try{r=await run(cmd)}catch{r='Something went wrong.'}
  busy=false;awake=Date.now()+8000;
  await speak(r);
}

/* ---------- reminders ---------- */
function schedule(r){
  const ms=Math.max(0,r.due-Date.now());
  setTimeout(async()=>{
    if(!rems.find(x=>x.id===r.id))return;
    rems=rems.filter(x=>x.id!==r.id);S.set('rems',rems);
    try{new Notification('Jarvis',{body:r.text})}catch{}
    navigator.vibrate&&navigator.vibrate([300,150,300]);
    await speak('Reminder. '+r.text);
  },ms);
}
function addRem(text,due){
  const r={id:Date.now()+Math.random(),text,due};rems.push(r);S.set('rems',rems);schedule(r);
  const m=Math.round((due-Date.now())/60000);
  return 'Okay. I will remind you to '+text+(m<1?' in a few seconds.':m<60?' in '+m+' minutes.':' at '+new Date(due).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})+'.');
}
const U={second:1e3,minute:6e4,hour:36e5};
const num=s=>/^an?$|^one$/i.test(s)?1:+s;
function parseRem(c){
  let m=c.match(/remind me (?:to )?(.+?),? in (\d+|an?|one) (second|minute|hour)s?$/i);
  if(m)return addRem(m[1],Date.now()+num(m[2])*U[m[3].toLowerCase()]);
  m=c.match(/remind me in (\d+|an?|one) (second|minute|hour)s?,? (?:to )?(.+)$/i);
  if(m)return addRem(m[3],Date.now()+num(m[1])*U[m[2].toLowerCase()]);
  m=c.match(/remind me (?:to )?(.+?),? at (\d{1,2})(?::(\d{2}))? ?([ap])?\.?m?\.?$/i);
  if(m){
    let h=+m[2],mi=+(m[3]||0);const ap=(m[4]||'').toLowerCase();
    if(ap==='p'&&h<12)h+=12;if(ap==='a'&&h===12)h=0;
    const d=new Date();d.setHours(h,mi,0,0);if(d<=Date.now())d.setDate(d.getDate()+(ap?1:0)||1);
    return addRem(m[1],d.getTime());
  }
  return null;
}

/* ---------- contacts & calling ---------- */
function setPend(f){pend=f;setTimeout(()=>{if(pend===f)pend=null},30000)}
async function pickContacts(){
  try{
    const r=await navigator.contacts.select(['name','tel'],{multiple:true});let n=0;
    r.forEach(x=>{if(x.name&&x.name[0]&&x.tel&&x.tel[0]){contacts[x.name[0].toLowerCase()]=x.tel[0].replace(/[^\d+]/g,'');n++}});
    S.set('contacts',contacts);speak('Saved '+n+' contacts.');
  }catch{speak('I could not open your contacts.')}
}
function findContact(n){n=n.toLowerCase().trim().replace(/^(my |mr |mrs |ms )/,'');const k=Object.keys(contacts);return k.find(x=>x===n)||k.find(x=>x.split(' ')[0]===n)||k.find(x=>x.includes(n)||n.includes(x))}
function go(url){setPend(()=>{location.href=url});setTimeout(()=>{location.href=url},1500)}
function callName(n){
  const key=findContact(n);
  if(!key)return 'I do not have '+n+' saved. Say, add contacts, to import them.';
  go('tel:'+contacts[key]);return 'Calling '+key+'.';
}

/* ---------- memory about you ---------- */
const save=()=>{S.set('mem',mem);S.set('name',name)};
function learn(c){
  let m=c.match(/my name is ([\w ]{2,30})/i);
  if(m){name=m[1].trim();save();return}
  if(/^(i am|i'm|i work|i live|i like|i love|i prefer|i have|i study|i usually|my (birthday|favou?rite|wife|husband|sister|brother|mother|father|mom|dad|friend|company|business|job|work)\b)/i.test(c)&&!mem.includes(c)){mem.push(c);mem=mem.slice(-200);save()}
}
function null_or_clear(){mem=[];hist=[];save();return 'I have forgotten everything except your name.'}
function backup(){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify({name,mem,notes,tasks,contacts})],{type:'application/json'}));
  a.download='jarvis-memory.json';a.click();speak('Backup saved to your downloads.');
}
function restore(){
  const i=document.createElement('input');i.type='file';i.accept='.json';
  i.onchange=async()=>{try{const d=JSON.parse(await i.files[0].text());
    name=d.name||name;mem=d.mem||mem;notes=d.notes||notes;tasks=d.tasks||tasks;contacts=d.contacts||contacts;
    save();S.set('notes',notes);S.set('tasks',tasks);S.set('contacts',contacts);speak('Memory restored.')}catch{speak('That file did not work.')}};
  i.click();
}

/* ---------- calculator & units ---------- */
const fmt=n=>n.toLocaleString('en-IN',{maximumFractionDigits:2});
const UN={km:['l',1000],kilometer:['l',1000],kilometre:['l',1000],mile:['l',1609.344],m:['l',1],meter:['l',1],metre:['l',1],cm:['l',.01],foot:['l',.3048],feet:['l',.3048],inch:['l',.0254],inche:['l',.0254],kg:['m',1],kilogram:['m',1],gram:['m',.001],g:['m',.001],pound:['m',.45359237],lb:['m',.45359237],litre:['v',1],liter:['v',1],l:['v',1],ml:['v',.001],gallon:['v',3.78541],celsiu:['t'],fahrenheit:['t']};
function conv(v,a,b){const nu=x=>UN[x.replace(/s$/,'')]||UN[x];const A=nu(a),B=nu(b);if(!A||!B||A[0]!==B[0])return null;
  if(A[0]==='t')return /^c/.test(a)?v*9/5+32:(v-32)*5/9;return v*A[1]/B[1]}
function calc(l){
  const n=x=>parseFloat(x.replace(/,/g,''));
  let m=l.match(/(\d[\d,.]*)\s*(?:percent|%) of (\d[\d,.]*)/);
  if(m)return m[1]+' percent of '+m[2]+' is '+fmt(n(m[1])*n(m[2])/100);
  m=l.match(/(\d[\d,.]*)\s*([a-z]+)\s+(?:to|in|into)\s+([a-z]+)$/);
  if(m){const r=conv(n(m[1]),m[2],m[3]);if(r!=null)return m[1]+' '+m[2]+' is '+fmt(r)+' '+m[3]}
  const e=l.replace(/^(what('?s| is)|calculate|how much is|compute)\s+/,'').replace(/,/g,'').replace(/\bplus\b/g,'+').replace(/\bminus\b/g,'-').replace(/\b(times|multiplied by|into|x)\b/g,'*').replace(/\b(divided by|over)\b/g,'/');
  if(/^[\d\s+\-*/().]+$/.test(e)&&/\d\s*[+\-*/]\s*\d/.test(e)){try{const v=Function('"use strict";return ('+e+')')();if(isFinite(v))return 'It is '+fmt(v)}catch{}}
  return null;
}

/* ---------- weather & briefing ---------- */
async function weather(){
  const pos=await new Promise((ok,no)=>navigator.geolocation.getCurrentPosition(ok,no,{timeout:8000,maximumAge:6e5}));
  const d=await(await fetch('https://api.open-meteo.com/v1/forecast?latitude='+pos.coords.latitude+'&longitude='+pos.coords.longitude+'&current=temperature_2m,weather_code&daily=temperature_2m_max,precipitation_probability_max&timezone=auto&forecast_days=1',{signal:AbortSignal.timeout(6000)})).json();
  const w=d.current.weather_code,t=w===0?'clear':w<=3?'partly cloudy':w<=48?'foggy':w<=67?'rainy':w<=77?'snowy':w<=82?'showery':'stormy';
  return 'It is '+Math.round(d.current.temperature_2m)+' degrees and '+t+'. The high today is '+Math.round(d.daily.temperature_2m_max[0])+', with a '+d.daily.precipitation_probability_max[0]+' percent chance of rain.';
}
async function briefing(){
  const h=new Date().getHours(),now=new Date();
  let t=(h<12?'Good morning':h<17?'Good afternoon':'Good evening')+(name?' '+name:'')+'. It is '+now.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})+', '+now.toLocaleDateString([],{weekday:'long',day:'numeric',month:'long'})+'. ';
  try{t+=await weather()+' '}catch{}
  const td=rems.filter(r=>new Date(r.due).toDateString()===now.toDateString());
  t+=td.length?'You have '+td.length+' reminders today. '+list(td.map(r=>r.text))+'. ':'No reminders today. ';
  t+=tasks.length?'You have '+tasks.length+' tasks. '+list(tasks.slice(0,5))+'. ':'Your task list is empty. ';
  if(S.get('api','')&&navigator.onLine){try{t+='Top news. '+await ask('Give me today\'s top 3 news headlines, one short sentence each.')}catch{}}
  return t;
}

/* ---------- sync with Worker ---------- */
const base=()=>S.get('api','').replace(/\/+$/,'');
const hdr=()=>{const h={'Content-Type':'application/json'},t=S.get('token','');if(t)h['X-Token']=t;return h};
async function push(){const b=base();if(!b||!navigator.onLine)return;try{await fetch(b+'/sync',{method:'PUT',headers:hdr(),body:JSON.stringify({ts:+localStorage.getItem('ts')||Date.now(),name,mem,notes,tasks,contacts}),signal:AbortSignal.timeout(6000)})}catch{}}
async function pull(){
  const b=base();if(!b||!navigator.onLine)return;
  try{
    const d=await(await fetch(b+'/sync',{headers:hdr(),signal:AbortSignal.timeout(4000)})).json(),lt=+localStorage.getItem('ts')||0;
    if(d.ts&&d.ts>lt){name=d.name||'';mem=d.mem||[];notes=d.notes||[];tasks=d.tasks||[];contacts=d.contacts||{};
      const o={name,mem,notes,tasks,contacts};for(const k in o)localStorage.setItem(k,JSON.stringify(o[k]));localStorage.setItem('ts',d.ts)}
    else if(lt>(d.ts||0))push();
  }catch{}
}

/* ---------- commands ---------- */
const list=a=>a.map((x,i)=>(i+1)+'. '+x).join('. ');
async function run(c){
  const l=c.toLowerCase().replace(/[.!?]+$/,'');let m;
  if(awaitName){awaitName=false;name=c.replace(/^(my name is|i am|i'm|call me|it'?s)\s+/i,'').replace(/[.!?]+$/,'').trim();save();return 'Nice to meet you, '+name+'. I will remember you.'}
  if(/^(stop|quiet|cancel|shut up|never ?mind)$/.test(l)){speechSynthesis.cancel();return ''}
  if(/^(go to sleep|goodbye|bye|sleep)/.test(l)){on=false;awake=0;try{rec.stop()}catch{}return 'Goodbye. Tap me when you need me.'}
  if(/what('?s| is) the time|what time/.test(l))return 'It is '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
  if(/what('?s| is) (the )?(date|day)|today'?s date/.test(l))return 'Today is '+new Date().toLocaleDateString([],{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  if(/^(add|import|sync|save) (my )?contacts?$/.test(l)){if(!navigator.contacts){return 'This browser cannot open contacts. Use Chrome on Android.'}setPend(pickContacts);return 'Tap the orb, then choose the contacts to save.'}
  if(m=l.match(/^(?:speak|talk|switch to|reply in|use|change language to) (english|hindi|tamil|kannada|telugu|malayalam)/)){
    const L={english:['en-IN','English'],hindi:['hi-IN','Hindi'],tamil:['ta-IN','Tamil'],kannada:['kn-IN','Kannada'],telugu:['te-IN','Telugu'],malayalam:['ml-IN','Malayalam']}[m[1]];
    S.set('lang',L[0]);S.set('langName',L[1]);pickVoice();try{rec&&rec.stop()}catch{}rec=null;return 'Okay. Now speaking '+L[1]+'.'}
  if(/^(good (morning|afternoon|evening)|daily briefing|brief me|my briefing|plan my day|what'?s my day)/.test(l))return briefing();
  if(/\b(weather|temperature|raining|rain)\b/.test(l)&&!/tomorrow|week/.test(l)&&!/\b(in|at|for|of) (?!the\b|today|here|my\b|this\b)\w+/.test(l)){try{return await weather()}catch{return 'I could not get the weather. Please allow location for this site.'}}
  if(m=l.match(/(?:set (?:an? )?alarm|wake me(?: up)?)(?: for| at)? (\d{1,2})(?::(\d{2}))? ?([ap])?\.?m?\.?/)){
    let h=+m[1],mi=+(m[2]||0);const ap=m[3];if(ap==='p'&&h<12)h+=12;if(ap==='a'&&h===12)h=0;
    const d=new Date();d.setHours(h,mi,0,0);if(d<=Date.now())d.setDate(d.getDate()+1);
    rems.push({id:Date.now(),text:'Wake up. Your alarm is ringing.',due:d.getTime()});S.set('rems',rems);schedule(rems[rems.length-1]);
    go('intent:#Intent;action=android.intent.action.SET_ALARM;i.android.intent.extra.alarm.HOUR='+h+';i.android.intent.extra.alarm.MINUTES='+mi+';S.android.intent.extra.alarm.MESSAGE=Jarvis;B.android.intent.extra.alarm.SKIP_UI=true;end');
    return 'Alarm set for '+d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})+'.'}
  if(m=l.match(/timer(?: for)? (\d+|an?|one) (second|minute|hour)s?/)){const n=num(m[1]);addRem('Your timer is done.',Date.now()+n*U[m[2]]);return 'Timer set for '+n+' '+m[2]+(n>1?'s':'')+'.'}
  if(m=l.match(/^open (.+)/)){
    const A={youtube:'https://www.youtube.com',whatsapp:'whatsapp://send',maps:'https://maps.google.com',gmail:'https://mail.google.com',instagram:'https://www.instagram.com',facebook:'https://www.facebook.com',google:'https://www.google.com',chrome:'https://www.google.com',telegram:'https://t.me/',spotify:'https://open.spotify.com',amazon:'https://www.amazon.in',flipkart:'https://www.flipkart.com',twitter:'https://x.com'};
    const k=Object.keys(A).find(x=>m[1].includes(x));if(k){go(A[k]);return 'Opening '+k+'.'}
    return 'I can open YouTube, WhatsApp, Maps, Gmail, Instagram, Facebook, Google, Telegram, Spotify, Amazon or Flipkart.'}
  if(m=l.match(/^(?:navigate|directions|take me|drive|route)(?: me)?(?: to)? (.+)/)){go('https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(m[1]));return 'Starting directions to '+m[1]+'.'}
  if(m=l.match(/^(?:play|search youtube for|youtube) (.+?)(?: on youtube)?$/)){go('https://www.youtube.com/results?search_query='+encodeURIComponent(m[1]));return 'Searching YouTube for '+m[1]+'.'}
  if(m=c.match(/^(?:send (?:a |an )?)?(message|msg|text|sms|whatsapp)(?: message)?(?: to)? (.+)$/i)){
    const wa=/whatsapp/i.test(c);let parts=m[2].split(/\s+(?:saying|say|that says|that|to say)\s+/i);
    let nm=parts[0].replace(/\s+(on|in|via|by|using)\s+(whatsapp|sms|text)$/i,''),body=parts.slice(1).join(' '),key=null;
    if(parts.length>1)key=findContact(nm);
    else{const w=nm.split(' ');for(let i=Math.min(3,w.length);i>0&&!key;i--){const k=findContact(w.slice(0,i).join(' '));if(k){key=k;body=w.slice(i).join(' ')}}}
    if(!key)return 'I do not have that contact saved. Say, add contacts, first.';
    if(!body)return 'What should I say to '+key+'? Say, message '+key+' saying, and then your message.';
    let num=contacts[key].replace(/\D/g,'');
    if(wa){if(num.length===10)num='91'+num;go('https://wa.me/'+num+'?text='+encodeURIComponent(body))}
    else go('sms:'+contacts[key]+'?body='+encodeURIComponent(body));
    return 'Opening '+(wa?'WhatsApp':'messages')+' for '+key+'. Tap send.'}
  if(m=l.match(/^(?:call|phone|dial|ring)(?: up)? (.+)/))return callName(m[1].replace(/^(my |mr |mrs |ms )/,''));
  if(/^remind me/.test(l)){const r=parseRem(c.replace(/[.!?]+$/,''));return r||'Tell me when. For example, remind me to call Abi in ten minutes.'}
  if(/(my |the )?reminders?( list)?$/.test(l)&&/^(what|list|read|show|any)/.test(l))return rems.length?'You have '+list(rems.map(r=>r.text+' at '+new Date(r.due).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}))):'No reminders.';
  {const r=calc(l);if(r)return r}
  if(m=l.match(/^(?:add|take|make|save|write)(?: a)? note(?: that| to)? (.+)/)){notes.push(c.slice(c.toLowerCase().indexOf(m[1])));S.set('notes',notes);return 'Note saved.'}
  if(/^(read|what are|list|show)( me)?( my| the)? notes/.test(l))return notes.length?'You have '+notes.length+' notes. '+list(notes):'You have no notes.';
  if(/^(clear|delete) (all )?(my )?notes/.test(l)){notes=[];S.set('notes',notes);return 'All notes cleared.'}
  if(m=l.match(/^add (.+?) to (?:my )?(?:tasks?|to-?do)(?: list)?$/)||l.match(/^(?:add )?(?:a )?task (?:to )?(.+)/)){tasks.push(m[1]);S.set('tasks',tasks);return 'Task added: '+m[1]}
  if(/^(read|what are|list|show|what'?s)( me)?( my| on my)? (tasks?|to-?do)/.test(l))return tasks.length?'You have '+tasks.length+' tasks. '+list(tasks):'Your task list is empty.';
  if(m=l.match(/^(?:complete|finish|done with|remove|delete) task (?:number )?(\d+)/)){const i=+m[1]-1;if(tasks[i]){const t=tasks.splice(i,1)[0];S.set('tasks',tasks);return 'Done. Removed '+t}return 'I could not find that task.'}
  if(/what do you (know|remember)( about me)?|who am i/.test(l))return (name?'You are '+name+'. ':'I do not know your name yet. ')+(mem.length?'I remember: '+list(mem.slice(-15)):'You have not told me anything else yet.');
  if(m=l.match(/^forget (?:that |about )?(.+)/)){if(/^everything|^all/.test(m[1]))return null_or_clear();const n=mem.length;mem=mem.filter(x=>!x.toLowerCase().includes(m[1]));save();return n>mem.length?'Forgotten.':'I could not find that in my memory.'}
  if(/^(back ?up|export) (my )?(memory|data)/.test(l)){setPend(backup);return 'Tap the orb to save your backup.'}
  if(/^(restore|import) (my )?(memory|data|backup)/.test(l)){setPend(restore);return 'Tap the orb, then choose your backup file.'}
  if(m=c.match(/^remember (?:that )?(.+)/i)){mem.push(m[1]);save();return 'I will remember that.'}
  if(/^(forget everything|clear (my )?memory)/.test(l)){mem=[];hist=[];S.set('mem',mem);return 'Memory cleared.'}
  learn(c);
  return ask(c);
}

/* ---------- AI brain (your Cloudflare Worker) ---------- */
async function ask(c){
  const api=S.get('api','');
  if(!api)return 'I need my brain link first. Press and hold the orb to set it.';
  if(!navigator.onLine)return 'I am offline right now, but reminders, notes, tasks and calculations still work.';
  hist.push({role:'user',content:c});hist=hist.slice(-12);
  const r=await fetch(api,{method:'POST',headers:hdr(),body:JSON.stringify({
    messages:hist,memory:(name?['The user\'s name is '+name]:[]).concat(mem),
    system:'You are Jarvis, a voice-only assistant. Reply in one to three short spoken sentences. No lists, no markdown, no emojis. Reply in '+S.get('langName','English')+'. You can search the web for current information.'
  })});
  const d=await r.json();const t=(d.reply||d.text||'I have no answer for that.').trim();
  hist.push({role:'assistant',content:t});return t;
}

/* ---------- start / settings ---------- */
async function start(){
  if(!SR){hint.textContent='use Chrome';return}
  on=true;hint.textContent='say "Jarvis"';state('listen');
  try{Notification.requestPermission()}catch{}
  try{navigator.wakeLock&&await navigator.wakeLock.request('screen')}catch{}
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch{}
  await pull();
  awake=Date.now()+8000;
  if(name)speak('Hello '+name+'. I am listening.');
  else{awaitName=true;speak('Hello. I am Jarvis. What should I call you?')}
}
let pt;
orb.addEventListener('pointerdown',()=>{pt=setTimeout(()=>{pt=0;
  const a=prompt('Brain link (your Cloudflare Worker URL):',S.get('api',''));if(a!==null){S.set('api',a.trim());const t=prompt('Access token (the APP_TOKEN you set, or leave empty):',S.get('token',''));if(t!==null)S.set('token',t.trim())}
},700)});
orb.addEventListener('pointerup',()=>{if(pt){clearTimeout(pt);if(pend){const f=pend;pend=null;return f()}on?speechSynthesis.cancel():start()}});
rems=rems.filter(r=>true);rems.forEach(schedule);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&on)listen()});

/* offline support */
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
